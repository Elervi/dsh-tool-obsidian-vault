name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # --legacy-peer-deps: the @deepseek-ai peer chain (dsh-agent/llm/scope/...)
        # is provided at runtime by the host dsh profile, not by npm. The rc
        # tags on npm drift ahead of 0.1.0-rc.6 (npm resolves ^0.1.0-rc.6 to rc.7,
        # whose transitive peers conflict with our pinned rc.6), so we skip
        # peer resolution and only materialize the compile-time deps.
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Smoke test (shim FS)
        # 不设 SMOKE_VAULT：写工具在临时目录验证，只读真实 vault 部分跳过
        run: npm test

      - name: Regression tests
        run: npm run test:fixes

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # devDependencies 已与 peerDependencies 对齐（0.1.1-rc.2 核心链 +
        # cordis 4.0.1 + schemastery 3.18.1），npm install 干净通过，无需
        # --legacy-peer-deps；运行时依赖（dsh-tools/dsh-llm/cordis/schemastery）
        # 由宿主 profile 提供。
        run: npm install

      - name: Build
        run: npm run build

      - name: Smoke test (shim FS)
        # 不设 SMOKE_VAULT：写工具在临时目录验证，只读真实 vault 部分跳过
        run: npm test

      - name: Regression tests
        run: npm run test:fixes

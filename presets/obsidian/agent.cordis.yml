# The `obsidian` agent preset (self-contained distribution copy): the standard
# coding agent, specialized for a local Obsidian vault.
#
# This directory IS the preset: copy it into ~/.dsh/.agent-presets/<id>/ and
# restart DSH. The folder name becomes the preset id shown in the new-session
# picker. Install steps and customization notes: see README.md in this folder.
#
# Compared to the shipped `standard` preset, three things change:
#   1. persona             — an Obsidian note-taking assistant, vault-root aware
#   2. tool-obsidian-vault — mounts the vendored plugin dsh-tool-obsidian-vault
#      (vendor/dsh-tool-obsidian-vault, built lib/ + runtime node_modules), so
#      only sessions on THIS preset can call the vault tools
#   3. skill-filesystem    — additionally scans this preset's own skills/
#      directory for preset-local skills (e.g. obsidian-conventions)
#
# The plugin row uses a RELATIVE specifier (./vendor/...): the loader resolves
# relative names against this preset's own directory, so the whole folder is
# self-contained and travels anywhere — no absolute paths, nothing to edit
# after install. Keep the vendor/ subfolder complete; refreshing it is
# documented in vendor/dsh-tool-obsidian-vault/VENDOR.md.
#
# This file is an AGENT-PLANE composition: every tool and prompt section it
# registers belongs to sessions that name this preset. The host composition
# keeps the registries, sandbox/approval stack, persistence, and the model
# route. A service row here MUST sit inside a group carrying an `isolate`
# realm; `true` means an entry-local realm — one private instance per mount.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
# Note: {{cwd}} is merely the directory the session was launched from — it is
# NOT guaranteed to be an Obsidian vault root (it may be a dev/other folder),
# so the persona must never claim so. The vault tools resolve the actual vault
# per call (see the tool-obsidian-vault row below).
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are an Obsidian note-taking agent powered by the {{model}} model.
      {{cwd}} is the session's working directory; it may or may not be an
      Obsidian vault root — never assume it is. Whether this session is bound
      to a vault is declared in the tools:obsidian-vault prompt section
      (bound via dsh-dock per-vault injection, or unbound). Follow that
      declaration — never invent a "current vault" when unbound.

      The working directory ({{cwd}}) and the Obsidian vault (when bound) are
      TWO DIFFERENT things and must never be conflated. When asked about the
      working directory or where you are operating, answer with {{cwd}}.
      Report a "current vault" ONLY when the session is bound or after
      calling vault_current and reading its basis; never invent one when
      unbound, and never call a working directory a vault.

      The tools:obsidian-vault section carries the vault conventions and tool
      workflow; follow it. Respect the vault's existing style: plain Markdown
      with ## headings, preserve frontmatter/properties, treat .obsidian/ as
      app-private config, and prefer vault tools over plain file tools for
      notes. State your intent before creating or modifying notes.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── vault tools (vendored tree-out plugin) ──────────────────────────────────

# Mounts the vendored dsh-tool-obsidian-vault. The plugin registers 16
# model-callable tools — read: vault_list_vaults / vault_current /
# vault_list_notes / vault_list_folders / vault_search / vault_search_tags /
# vault_read_note / vault_note_info / vault_backlinks / vault_frontmatter /
# vault_note_links; write: vault_create_note / vault_edit_note /
# vault_append_note / vault_update_frontmatter / vault_rename_note — plus a
# `tools:obsidian-vault` prompt section. It publishes no services, so no realm
# is needed. vaultRoot is omitted on purpose: each call falls back to the
# calling session's cwd. Tune the config below (maxResults / ignoreDirs /
# vaultRoot / allowArbitraryRoots / ...) as you like.
- id: tool-obsidian-vault
  name: './vendor/dsh-tool-obsidian-vault/lib/index.js'
  config:
    maxResults: 20
    ignoreDirs: ['.obsidian', '.git', '.claudian', '.trash']

# ── shell ───────────────────────────────────────────────────────────────────

# Shell executors (bash-sandbox / pwsh-sandbox) stay on the host plane; only
# the model-facing tools are per-session.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so they
# need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls; the task registry stays on the host plane.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `customSkillDirs` points at this preset's own skills/ directory (baseUrl is
# the preset's directory wherever it is installed), so obsidian-conventions
# travels with the preset. Default roots (project / ~/.dsh/skills) still apply.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool; the goal service and /goal command stay on the
# host plane.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is correct.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# compaction-basic reads toolResultPrune through ctx.get, so the pruner shares
# this realm; the tokenMeter stays on the host plane.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The subagents registry and its backends live in the HOST composition; this
# preset contributes the delegation TOOLS. workflows is agent-local, so every
# row that reaches it shares one entry-local realm here.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Product providers are host-plane singletons. Copy this preset, then
    # remove `disabled` from either ordinary tool row to expose that product
    # only to agents composed from the copy.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# str_replace_editor 被 web bundle 在 host 层禁用，需要由预设补挂（同 minimal
# 的配置）。
- id: str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  config:
    maxOutputChars: 16000
